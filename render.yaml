services:
  # PostgreSQL Database
  - type: pserv
    name: queen-bee-db
    plan: free
    region: oregon
    databaseName: queenbee
    databaseUser: queenbee_user

  # Web Service
  - type: web
    name: queen-bee-candles
    env: node
    region: oregon
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: queen-bee-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false # Set manually in dashboard
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false # Set manually in dashboard
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false # Set manually in dashboard
      - key: VITE_API_URL
        value: https://queen-bee-candles.onrender.com
